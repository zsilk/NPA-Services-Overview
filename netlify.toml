# Static single-page site: no build step, publish the repo root as-is.
[build]
  publish = "."
  command = ""

# Cache the self-hosted fonts aggressively — they change rarely and are
# requested on every page load. Bump the filename if a font is ever replaced.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
